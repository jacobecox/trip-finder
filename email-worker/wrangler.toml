# Cloudflare Email Worker for trips@jacobcox.dev. Secrets (not in this file):
#   wrangler secret put EMAIL_SECRET     # same value as EMAIL_SECRET on Vercel
#   wrangler secret put FORWARD_TO       # your verified Email Routing destination address
#   wrangler secret put ALLOWED_SENDERS  # comma-separated senders allowed to import
name = "trip-finder-email"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# no destination_address: may send to any verified Email Routing destination; the code always uses FORWARD_TO
send_email = [{ name = "EMAIL" }]

[vars]
APP_URL = "https://trips.jacobcox.dev"
FROM_ADDRESS = "trips@jacobcox.dev"
